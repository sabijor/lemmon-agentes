<style>
:root{
  --bg:#fdfdfd; --ink:#1c1917; --muted:#78716c; --muted2:#a8a29e;
  --line:#e7e5e4; --line2:#d6d3d1; --surface:#f5f5f4; --white:#fff;
  --green:#15803d; --green-bg:#f0fdf4; --green-line:#bbf7d0;
  --amber:#d97706; --amber-bg:#fffbeb; --amber-line:#fde68a;
  --display:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);
  padding-bottom:90px;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.035;z-index:1;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;opacity:.5}
.blob.a{top:-80px;right:-60px;width:340px;height:340px;background:#fef3c7}
.blob.b{top:30%;left:-120px;width:300px;height:300px;background:#eef0f1}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;position:relative;z-index:2}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}

header.top{position:sticky;top:0;z-index:20;background:rgba(253,253,253,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.head-in{max-width:760px;margin:0 auto;padding:14px 16px 12px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);display:flex;align-items:center;gap:7px;margin-bottom:7px}
.eyebrow .ball{font-size:14px;color:var(--ink)}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);display:inline-block}
h1.title{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.03em;margin:0;line-height:1}
h1.title b{font-weight:700}
h1.title .yr{color:var(--amber)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:11px 8px 9px;text-align:left}
.kpi b{font-family:var(--display);display:block;font-size:23px;font-weight:600;line-height:1;letter-spacing:-.02em}
.kpi span{font-family:var(--mono);font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.12em;font-weight:500;display:block;margin-top:6px}
.kpi.have b{color:var(--green)} .kpi.miss b{color:var(--amber)}
.barrow{display:flex;align-items:center;gap:10px;margin-top:13px}
.bar{flex:1;height:8px;border-radius:6px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ink) 60%,var(--amber));border-radius:6px;transition:width .6s var(--ease)}
.barrow .pc{font-family:var(--display);font-weight:600;font-size:13px;min-width:34px;text-align:right}
.tools{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:0 12px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.search svg{color:var(--muted2);font-size:17px;flex-shrink:0}
.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font-family:var(--sans);font-size:15px;padding:11px 0;outline:none}
.search input::placeholder{color:var(--muted2)}
.row2{display:flex;gap:8px;align-items:stretch}
.seg{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;text-align:center;background:transparent;border:0;color:var(--muted);font-family:var(--sans);font-weight:600;font-size:13px;padding:9px 8px;cursor:pointer;border-radius:9px;transition:all .2s}
.seg button.on{background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(28,25,23,.18)}
.sortbtn{display:flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.sortbtn svg{font-size:15px;color:var(--muted)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:13px 16px 3px;scrollbar-width:none;position:relative;z-index:2}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--white);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:999px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em;cursor:pointer;transition:all .2s;flex-shrink:0}
.chip.grp{color:var(--amber);border-color:var(--amber-line);background:var(--amber-bg)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .c{opacity:.65;font-weight:400;margin-left:2px}
.hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--muted2);text-align:center;padding:3px 16px 6px}

.sec{background:var(--white);border:1px solid var(--line);border-radius:20px;margin:12px 0;overflow:hidden;transition:box-shadow .3s}
.sec.open{box-shadow:0 10px 30px -16px rgba(28,25,23,.18)}
.sec-h{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;user-select:none}
.flag{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink)}
.sec-h .t{flex:1;min-width:0}
.sec-h .t b{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-h .t span{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em;display:flex;align-items:center;gap:6px;margin-top:3px}
.tagp{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.mini{width:58px;flex-shrink:0;text-align:right}
.mini b{font-family:var(--display);font-weight:600;font-size:13px}
.mini .mbar{height:5px;border-radius:4px;background:var(--surface);margin-top:4px;overflow:hidden;border:1px solid var(--line)}
.mini .mbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ink),var(--amber))}
.caret{color:var(--muted2);transition:transform .25s var(--ease);font-size:18px;width:18px;display:flex;justify-content:center}
.sec.open .caret{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px;padding:0 12px 14px;align-items:start}
.sec:not(.open) .grid{display:none}
.cell{position:relative;border-radius:13px;padding:9px 10px 10px;min-height:64px;border:1px solid var(--line);background:var(--white);cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .08s,background .2s}
.cell:active{transform:scale(.95)}
.cell.have{background:var(--green-bg);border-color:var(--green-line)}
.cell.pop{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
.cell .code{font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase}
.cell.have .code{color:var(--green)}
.cell .nm{font-size:12px;font-weight:600;line-height:1.2;word-break:break-word;color:var(--ink);flex:1}
.cell .st{position:absolute;top:8px;right:8px;font-size:15px;color:var(--amber-line);line-height:0}
.cell.have .st{color:var(--green)}
.dup{display:flex;align-items:center;gap:6px;margin-top:2px}
.dup .lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--muted2);text-transform:uppercase}
.dup .stp{display:flex;align-items:center;gap:0;margin-left:auto;border:1px solid var(--green-line);border-radius:8px;overflow:hidden;background:var(--white)}
.dup button{width:22px;height:22px;border:0;background:transparent;color:var(--green);font-size:15px;font-weight:700;cursor:pointer;line-height:1;font-family:var(--sans)}
.dup .n{font-family:var(--display);font-size:12px;font-weight:600;min-width:16px;text-align:center;color:var(--ink)}
.empty{font-family:var(--mono);color:var(--muted2);text-align:center;padding:46px 10px;font-size:13px;letter-spacing:.04em}

footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(253,253,253,.86);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px 16px;padding-bottom:max(9px,env(safe-area-inset-bottom))}
.fbar{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.fbar .info{flex:1;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line2);color:var(--ink);font-family:var(--sans);font-weight:600;font-size:12.5px;padding:9px 13px;border-radius:11px;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.96)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn svg{font-size:15px}

.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);z-index:40;background:var(--ink);color:#fff;border-radius:13px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .3s var(--ease);max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast b{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-line);cursor:pointer;padding:4px 6px}

.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(28,25,23,.45);opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px)}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:8px 16px max(20px,env(safe-area-inset-bottom));transform:translateY(101%);transition:transform .35s var(--ease);max-width:760px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:3px;background:var(--line2);margin:8px auto 14px}
.sheet h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 4px}
.sheet .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:14px}
.act{display:flex;align-items:center;gap:13px;width:100%;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;cursor:pointer;text-align:left;font-family:var(--sans);transition:all .15s}
.act:active{transform:scale(.98);background:var(--surface)}
.act .ic{width:38px;height:38px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--ink);flex-shrink:0}
.act.danger .ic{background:#fef2f2;color:#b91c1c}
.act .tx b{display:block;font-weight:600;font-size:14.5px}
.act .tx span{font-size:11.5px;color:var(--muted)}
.ta{width:100%;height:150px;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--ink);background:var(--white);resize:none;margin-bottom:10px}

/* ---- print / PDF document ---- */
#printdoc{display:none}
.pd{font-family:var(--sans);color:#1c1917}
.pd-head{border-bottom:1.5px solid #1c1917;padding-bottom:7px;margin-bottom:12px}
.pd h1{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.pd h1 .hcount{font-size:18px;color:#d97706}
.pd .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#78716c;text-transform:uppercase;margin-top:3px}
.pd-team{break-inside:avoid;margin-bottom:9px}
.pd-team .tn{font-family:var(--display);font-weight:600;font-size:12.5px}
.pd-team .tn .ct{color:#d97706;font-weight:500;margin-left:3px}
.pd-cols{column-count:3;column-gap:22px;margin-top:3px}
.pd-item{break-inside:avoid;font-size:10.5px;line-height:1.5;color:#292524}
.pd-item code{font-family:var(--mono);font-size:9px;color:#78716c;letter-spacing:.02em;margin-right:4px}
@media print{
  @page{margin:13mm}
  .noise,.blob,header.top,footer,.chips,.hint,.wrap,.toast,.sheet,.sheet-bg{display:none!important}
  body{padding:0!important;background:#fff!important}
  #printdoc{display:block!important}
}

function saveD(){localStorage.setItem(DUP,JSON.stringify(dupes))}
function saveOpen(){localStorage.setItem(OPEN,JSON.stringify(openState))}
const BASE_DUP={};DATA.sections.forEach(s=>s.slots.forEach(sl=>{if(sl.d)BASE_DUP[sl.code]=sl.d}));
function status(sl){return overrides[sl.code]||sl.status}
function dup(code){return (code in dupes)?dupes[code]:(BASE_DUP[code]||0)}
function esc(x){return (x==null?'':String(x)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function norm(x){return (x==null?'':String(x)).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function flagTxt(s){return s.team_code?s.team_code:(s.type==='special'?'CC':'★')}
function tagP(s){return s.type==='special'?'<span class="tagp">Especial</span>':s.type==='intro'?'<span class="tagp">Abertura</span>':''}
function counts(){let t=0,h=0;DATA.sections.forEach(s=>s.slots.forEach(sl=>{t++;if(status(sl)==='have')h++}));return{t,h,m:t-h}}
function secHave(s){return s.slots.filter(sl=>status(sl)==='have').length}
function findStatus(code){for(const s of DATA.sections)for(const sl of s.slots)if(sl.code===code)return sl.status;return 'missing'}

function buildChips(){
  const chips=$('chips');chips.innerHTML='';
  const mk=(label,val,cls,cnt)=>{const c=document.createElement('div');c.className='chip'+(cls?' '+cls:'')+(val===activeChip?' on':'');
    c.innerHTML=esc(label)+(cnt?'<span class="c">'+cnt+'</span>':'');
    c.onclick=()=>{activeChip=val;render()};return c};
  chips.appendChild(mk('TUDO','all',''));
  const groups=[...new Set(DATA.sections.map(s=>s.group).filter(Boolean))].sort();
  groups.forEach(g=>chips.appendChild(mk('GRP '+g,'grp:'+g,'grp')));
  DATA.sections.forEach(s=>{const v=s.team_code||s.title;
    chips.appendChild(mk(s.team_code?s.team_code:(s.title.length>11?s.title.slice(0,11)+'…':s.title),v,'',secHave(s)+'/'+s.slots.length))});
}

function viewSections(){
  let arr=DATA.sections.map((s,i)=>({s,i}));
  if(sortMode===1) arr.sort((a,b)=>{const ra=a.s.slots.length-secHave(a.s),rb=b.s.slots.length-secHave(b.s);
    const za=ra===0?1:0,zb=rb===0?1:0; if(za!==zb)return za-zb; return ra-rb});
  else if(sortMode===2) arr.sort((a,b)=>(b.s.slots.length-secHave(b.s))-(a.s.slots.length-secHave(a.s)));
  return arr;
}

function render(){
  const c=counts();
  $('k-total').textContent=c.t;$('k-have').textContent=c.h;$('k-miss').textContent=c.m;
  const pct=c.t?Math.round(c.h/c.t*100):0;
  $('k-pct').textContent=pct+'%';$('pc').textContent=pct+'%';$('bar').style.width=pct+'%';
  const done=DATA.sections.filter(s=>s.slots.every(sl=>status(sl)==='have')).length;
  $('finfo').innerHTML=done+'/'+DATA.sections.length+' COMPLETAS';
  buildChips();
  const q=norm(query.trim());const list=$('list');list.innerHTML='';let shown=0;
  viewSections().forEach(({s,i})=>{
    if(activeChip==='all'){}
    else if(activeChip.indexOf('grp:')===0){if(s.group!==activeChip.slice(4))return}
    else if((s.team_code||s.title)!==activeChip)return;
    const teamMatch=q&&(norm(s.title).includes(q)||norm(s.team_code).includes(q));
    let slots=s.slots.filter(sl=>{const st=status(sl);
      if(flt==='missing'&&st!=='missing')return false;
      if(flt==='have'&&st!=='have')return false;
      if(q&&!teamMatch)return norm(sl.player).includes(q)||norm(sl.code).includes(q);
      return true;});
    if(!slots.length)return;shown++;
    const h=secHave(s),tt=s.slots.length,p=tt?Math.round(h/tt*100):0;
    const isOpen=(s.file in openState)?openState[s.file]:(q||flt!=='all');
    const sec=document.createElement('div');sec.className='sec'+(isOpen?' open':'');
    sec.innerHTML='<div class="sec-h" data-sec="'+esc(s.file)+'">'+
      '<div class="flag">'+esc(flagTxt(s))+'</div>'+
      '<div class="t"><b>'+esc(s.title)+'</b><span>'+tagP(s)+(s.group?'Grupo '+s.group+' · ':'')+h+'/'+tt+' coladas</span></div>'+
      '<div class="mini"><b>'+p+'%</b><div class="mbar"><i style="width:'+p+'%"></i></div></div>'+
      '<div class="caret">'+ICN_caret+'</div></div>'+
      '<div class="grid">'+slots.map(sl=>{const st=status(sl);const dd=dup(sl.code);
        return '<div class="cell '+(st==='have'?'have':'')+'" data-code="'+esc(sl.code)+'">'+
          '<div class="st">'+(st==='have'?ICN.check:ICN.ring)+'</div>'+
          '<div class="code">'+esc(sl.code)+'</div><div class="nm">'+esc(sl.player)+'</div>'+
          (st==='have'?'<div class="dup"><span class="lab">Rep</span><div class="stp">'+
            '<button class="dbtn" data-d="-1" data-code="'+esc(sl.code)+'">−</button>'+
            '<span class="n">'+dd+'</span>'+
            '<button class="dbtn" data-d="1" data-code="'+esc(sl.code)+'">+</button></div></div>':'')+
        '</div>'}).join('')+'</div>';
    list.appendChild(sec);
  });
  if(!shown)list.innerHTML='<div class="empty">Nada encontrado</div>';
}

let lastAction=null,toastTimer=null;
function showToast(msg){$('toastmsg').textContent=msg;$('toast').classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),4200)}
function popCell(code){const el=document.querySelector('.cell[data-code="'+CSS.escape(code)+'"]');
  if(el){el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),460)}}

$('list').addEventListener('click',e=>{
  const db=e.target.closest('.dbtn');
  if(db){e.stopPropagation();const code=db.dataset.code,d=+db.dataset.d;
    let v=(dupes[code]||0)+d;if(v<0)v=0;if(v===0)delete dupes[code];else dupes[code]=v;saveD();render();return}
  const cell=e.target.closest('.cell');
  if(cell){const code=cell.dataset.code;const cur=overrides[code]||findStatus(code);const next=cur==='have'?'missing':'have';
    lastAction={code,prevOv:overrides[code],prevDup:dupes[code]};
    overrides[code]=next;if(next==='missing')delete dupes[code];
    saveO();saveD();render();
    if(next==='have'){popCell(code);if(navigator.vibrate)navigator.vibrate(12);showToast('Colada ✓')}
    else showToast('Marcada como falta');
    return}
  const h=e.target.closest('.sec-h');
  if(h){const sec=h.parentElement;sec.classList.toggle('open');
    openState[h.dataset.sec]=sec.classList.contains('open');saveOpen()}
});
$('undo').addEventListener('click',()=>{if(!lastAction)return;const{code,prevOv,prevDup}=lastAction;
  if(prevOv===undefined)delete overrides[code];else overrides[code]=prevOv;
  if(prevDup===undefined)delete dupes[code];else dupes[code]=prevDup;
  saveO();saveD();lastAction=null;$('toast').classList.remove('show');render()});

$('q').addEventListener('input',e=>{query=e.target.value;render()});
$('filter').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  [...$('filter').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');flt=b.dataset.f;render()});
$('sort').addEventListener('click',()=>{sortMode=(sortMode+1)%3;$('sortlab').textContent=SORTS[sortMode][0];render()});
$('expand').addEventListener('click',()=>{const vis=viewSections().map(o=>o.s);
  const allOpen=vis.every(s=>openState[s.file]);
  vis.forEach(s=>openState[s.file]=!allOpen);saveOpen();
  $('expand').innerHTML=(allOpen?'<svg class="i" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 011-1h4M20 15v4a1 1 0 01-1 1h-4M9 20H5a1 1 0 01-1-1v-4M15 4h4a1 1 0 011 1v4"/></svg> Expandir':'<svg class="i" viewBox="0 0 24 24"><path d="M9 4v4a1 1 0 01-1 1H4M15 20v-4a1 1 0 011-1h4M4 15h4a1 1 0 011 1v4M20 9h-4a1 1 0 01-1-1V4"/></svg> Recolher');render()});

// ---- bottom sheet ----
function openSheet(){$('sheet-menu').style.display='block';$('sheet-share').style.display='none';
  $('sheetbg').classList.add('show');$('sheet').classList.add('show')}
function closeSheet(){$('sheetbg').classList.remove('show');$('sheet').classList.remove('show')}
$('actions').addEventListener('click',openSheet);
$('sheetbg').addEventListener('click',closeSheet);
$('a-reset').addEventListener('click',()=>{closeSheet();
  if(confirm('Voltar tudo para o estado escaneado original? Isso apaga suas alterações manuais e as repetidas.')){
    overrides={};dupes={};saveO();saveD();render()}});

// ---- trade list ----
function buildTradeText(){
  let miss=[],rep=[];
  DATA.sections.forEach(s=>{
    const m=s.slots.filter(sl=>status(sl)==='missing');
    if(m.length){miss.push((s.group?'['+s.group+'] ':'')+s.title+': '+m.map(sl=>sl.code.replace(/^\D+/,'').trim()+' '+sl.player).join(', '))}
    s.slots.forEach(sl=>{const d=dup(sl.code);if(d>0&&status(sl)==='have')rep.push(sl.code+' '+sl.player+' ×'+d)});
  });
  const c=counts();
  let t='MEU ÁLBUM DA COPA 2026 — LISTA DE TROCA\n';
  t+='Coladas '+c.h+'/'+c.t+' ('+Math.round(c.h/c.t*100)+'%)\n\n';
  t+='FALTAM ('+c.m+'):\n'+(miss.length?miss.join('\n'):'— nenhuma, álbum completo!')+'\n\n';
  t+='REPETIDAS ('+rep.length+'):\n'+(rep.length?rep.join('\n'):'— nenhuma registrada');
  return t;
}
$('a-share').addEventListener('click',()=>{$('share-ta').value=buildTradeText();
  const c=counts();$('share-sub').textContent='FALTAM '+c.m+' · REPETIDAS '+Object.values(dupes).filter(v=>v>0).length;
  $('sheet-menu').style.display='none';$('sheet-share').style.display='block'});
$('share-back').addEventListener('click',()=>{$('sheet-menu').style.display='block';$('sheet-share').style.display='none'});
$('share-copy').addEventListener('click',()=>{const ta=$('share-ta');ta.select();
  try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand('copy')}
  $('share-copy').innerHTML='<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/></svg> Copiado!';setTimeout(()=>$('share-copy').innerHTML='<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/></svg> Copiar',1500)});
$('share-native').addEventListener('click',()=>{const txt=$('share-ta').value;
  if(navigator.share)navigator.share({title:'Lista de troca — Álbum Copa 2026',text:txt}).catch(()=>{});
  else{$('share-ta').select();try{navigator.clipboard.writeText(txt)}catch(e){}showToast('Copiado (compartilhar indisponível)')}});

// ---- backup ----
$('a-export').addEventListener('click',()=>{closeSheet();
  const data={v:1,app:'album-copa-2026',exportedAt:new Date().toISOString(),overrides,dupes};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='meu-album-copa-2026.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},500);showToast('Backup exportado')});
// ---- PDF (print) of what's missing ----
function scopeLabel(){
  let sc='Álbum completo';
  if(activeChip.indexOf('grp:')===0)sc='Grupo '+activeChip.slice(4);
  else if(activeChip!=='all'){const sec=DATA.sections.find(s=>(s.team_code||s.title)===activeChip);sc=sec?sec.title:activeChip}
  const qq=query.trim();
  if(qq)sc=(activeChip==='all'?'':sc+' · ')+'busca “'+qq+'”';
  return sc;
}
function buildPrintDoc(){
  const c=counts(),pct=c.t?Math.round(c.h/c.t*100):0;
  const d=new Date();const dd=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
  const q=norm(query.trim());let teams='',scopeMiss=0;
  DATA.sections.forEach(s=>{
    if(activeChip==='all'){}
    else if(activeChip.indexOf('grp:')===0){if(s.group!==activeChip.slice(4))return}
    else if((s.team_code||s.title)!==activeChip)return;
    const teamMatch=q&&(norm(s.title).includes(q)||norm(s.team_code).includes(q));
    let miss=s.slots.filter(sl=>status(sl)==='missing');
    if(q&&!teamMatch)miss=miss.filter(sl=>norm(sl.player).includes(q)||norm(sl.code).includes(q));
    if(!miss.length)return;scopeMiss+=miss.length;
    teams+='<div class="pd-team"><div class="tn">'+esc(s.title)+(s.group?' · Grupo '+s.group:'')+' <span class="ct">'+miss.length+'</span></div>'+
      '<div class="pd-cols three">'+miss.map(sl=>'<div class="pd-item"><code>'+esc(sl.code)+'</code>'+esc(sl.player)+'</div>').join('')+'</div></div>';
  });
  const sc=scopeLabel();
  $('printdoc').innerHTML='<div class="pd"><div class="pd-head">'+
    '<h1>Figurinhas que faltam <span class="hcount">'+scopeMiss+'</span></h1>'+
    '<div class="meta">'+esc(sc)+' · '+dd+' · álbum '+c.h+'/'+c.t+' ('+pct+'%)</div></div>'+
    (teams||'<p>Nada faltando neste filtro — tudo colado! 🎉</p>')+'</div>';
  return sc;
}
$('a-pdf').addEventListener('click',()=>{const sc=buildPrintDoc();closeSheet();
  const old=document.title;document.title='Faltam - '+sc;
  const restore=()=>{document.title=old;window.removeEventListener('afterprint',restore)};
  window.addEventListener('afterprint',restore);
  setTimeout(()=>{window.print();},400)});
$('a-import').addEventListener('click',()=>$('importfile').click());
$('importfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(d.overrides)overrides=d.overrides;if(d.dupes)dupes=d.dupes;saveO();saveD();render();closeSheet();showToast('Backup importado ✓')}
    catch(err){alert('Arquivo inválido.')}};rd.readAsText(f);e.target.value=''});

buildChips();render();
</script>
</body>
