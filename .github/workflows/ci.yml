name: CI

# v1.47 A5-003 / A6a-001 — Pipeline mínimo de CI:
# - backend: lint (ruff) + tests (pytest)
# - frontend: tsc check + build production Next.js
#
# Smoke tests Anthropic (test_agentes_smoke.py) são SKIPED quando ANTHROPIC_API_KEY
# está ausente — comportamento intencional pra não bloquear CI.

on:
  push:
    branches: [main, qa/**]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Backend Python — lint + tests
  # ─────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with ruff
        run: ruff check . --exclude .venv --exclude dashboard --exclude historico --exclude outputs
        continue-on-error: true  # warnings não bloqueiam, mas reporta

      - name: Run tests (sem chave Anthropic — smoke tests skipam)
        env:
          # Sem ANTHROPIC_API_KEY → smoke tests pulam graciosamente.
          # Outros 59 testes rodam sem chave (regressão, planilha, features).
          PYTHONUNBUFFERED: "1"
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_agentes_smoke.py \
            --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml

  # ─────────────────────────────────────────────────────────────────────
  # Frontend Next.js — tsc + build
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build production
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ─────────────────────────────────────────────────────────────────────
  # Security — bandit + pip-audit (warning-only)
  # ─────────────────────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Run bandit (Python security)
        run: bandit -r api/ core/ agentes/ -ll -ii --exclude /tests/
        continue-on-error: true  # warning-only

      - name: Run pip-audit
        run: pip-audit --requirement requirements.txt --strict
        continue-on-error: true  # warning-only
